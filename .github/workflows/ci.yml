# Tests + strict lint on every push and PR (including Dependabot's monthly update PRs).
# Needs no secrets: the Airtable token defaults to empty, release builds fall back to the debug key,
# and the tests run against an in-memory database and a fake Airtable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint (debug + release)
        run: ./gradlew :app:lintDebug :app:lintRelease --console=plain
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
