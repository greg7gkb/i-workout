# Monthly dependency updates, bundled into one PR per ecosystem. CI (workflows/ci.yml) runs tests + strict lint on it.
# Note: AGP versions are tied to Android Studio versions; if Studio can't sync after merging, update Studio.
version: 2
updates:
  # Libraries and plugins in gradle/libs.versions.toml, plus the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Versions of the GitHub Actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns: ["*"]
